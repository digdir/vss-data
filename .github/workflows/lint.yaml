name: Lint and Type Check

on:
  push:
    branches: [ local-dev ]
  pull_request:
    branches: [ local-dev ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black mypy flake8

    - name: Run Black
      run: black --check .

    - name: Run Flake8
      run: flake8 .

    - name: Run Mypy
      run: mypy .
